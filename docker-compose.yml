services:
  db:
    image: mysql:latest
    container_name: mysql_reports
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-reports_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: